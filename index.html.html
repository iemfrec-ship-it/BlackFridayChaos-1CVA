<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛍️ Black Friday Chaos — Escape Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#B8860B;--teal2:#E0B94D;--tl:#FBF3DE;
  --coral:#D62839;--coral2:#F2665A;--cl:#FDE8E6;
  --amber:#7C8595;--amber2:#C7CDD6;--am:#F1F2F4;
  --red:#B71C1C;--green:#2E7D32;
  --ink:#24262B;
  --bg:linear-gradient(135deg,#F6F6F3 0%,#FFF8E8 55%,#F1F1EE 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;background-attachment:fixed;color:var(--ink)}
h1,h2,h3,.pop{font-family:'Poppins',sans-serif}
.page{max-width:800px;margin:0 auto;padding:16px 18px 40px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 22px rgba(36,38,43,.10);padding:24px;margin-bottom:14px}
.card-teal{border-top:4px solid var(--teal)}
.card-coral{border-top:4px solid var(--coral)}
.card-amber{border-top:4px solid var(--amber)}
/* ── Glass pane pattern (shop-window grid) ── */
.glass{position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;opacity:.14;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 42px),repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 42px);}
/* ── Buttons ── */
.btn{border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;border-radius:50px;padding:10px 22px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 3px 0 #8B6914}
.btn-teal:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #8B6914}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 3px 0 #8E1B24}
.btn-coral:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #8E1B24}
.btn-amber{background:var(--amber);color:#fff;box-shadow:0 3px 0 #4F5866}
.btn-amber:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #4F5866}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 #7A1414}
.btn-red:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #7A1414}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 0 #1B5E20}
.btn-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #1B5E20}
.btn-gray{background:#E4E4E4;color:#555}
.btn-gray:hover:not(:disabled){background:#D3D3D3}
.btn-outline{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn-outline:hover:not(:disabled){background:var(--tl)}
.lg{font-size:1rem;padding:13px 30px}
.sm{font-size:.78rem;padding:6px 14px}
.full{width:100%;justify-content:center}
/* ── Header ── */
.hdr{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:2px solid #ECE3CE;padding:10px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(36,38,43,.10)}
.hdr-in{max-width:800px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
/* ── Progress ── */
.prg{display:flex;align-items:center;flex:1}
.prg-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;transition:all .3s;flex-shrink:0}
.prg-done{background:var(--teal);color:#fff;box-shadow:0 0 0 3px #EFDCA8}
.prg-active{background:var(--coral);color:#fff;box-shadow:0 0 0 3px #FAC7CB;animation:pls .8s ease-in-out infinite}
.prg-future{background:#EDEDED;color:#BBB}
.prg-line{flex:1;height:3px;margin:0 2px;transition:background .3s}
.prg-lbl{font-size:.5rem;font-weight:700;color:#AAA;text-align:center;margin-top:2px;max-width:48px;line-height:1.15}
/* ── Score pill ── */
.sc-pill{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:5px 15px;border-radius:50px;font-weight:800;font-size:.88rem;white-space:nowrap;box-shadow:0 3px 10px rgba(184,134,11,.25)}
.score-fab{position:fixed;top:12px;right:14px;z-index:45;background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:7px 17px;border-radius:50px;font-weight:800;font-size:.9rem;box-shadow:0 3px 12px rgba(184,134,11,.35);white-space:nowrap}
/* ── Persistent teacher button ── */
.prof-fab{position:fixed;bottom:16px;right:16px;z-index:40}
.rep-fab{position:fixed;bottom:16px;left:16px;z-index:40}
/* ── Inputs ── */
input,textarea{font-family:'Inter',sans-serif;border:2px solid #E0E0E0;border-radius:11px;padding:10px 13px;font-size:.9rem;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(184,134,11,.12)}
textarea{resize:vertical;font-family:'Inter',sans-serif;line-height:1.6}
/* ── QCM ── */
.opt{display:flex;align-items:center;gap:9px;padding:11px 14px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal2);background:var(--tl)}
.opt.sel{border-color:var(--teal);background:#FCF6E5}
.opt.right{border-color:var(--green);background:#EDF7EE}
.opt.wrong{border-color:var(--red);background:#FFEBEE}
.let{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0;transition:all .15s}
/* ── V/F ── */
.vfr{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:7px;transition:all .15s;flex-wrap:wrap}
.tvf{padding:5px 13px;border-radius:50px;border:2px solid;cursor:pointer;font-weight:700;font-size:.79rem;transition:all .15s;font-family:'Inter',sans-serif}
/* ── Matching ── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:9px 12px;border:2px solid #E8E8E8;border-radius:11px;cursor:pointer;font-weight:600;font-size:.83rem;min-height:50px;display:flex;align-items:center;transition:all .15s;line-height:1.35}
.mi:hover:not(.mu):not(.mok):not(.mko){border-color:var(--coral);background:var(--cl)}
.mi.msel{border-color:var(--coral);background:#FDE1E1;box-shadow:0 0 0 3px rgba(214,40,57,.18)}
.mi.mu{opacity:.4;cursor:default;border-style:dashed}
.mi.mok{border-color:var(--green);background:#EDF7EE;opacity:1;cursor:default}
.mi.mko{border-color:var(--red);background:#FFEBEE;opacity:1;cursor:default}
/* ── Situation card ── */
.sit{background:linear-gradient(135deg,var(--tl),var(--cl));border:2px solid var(--teal);border-radius:16px;padding:18px}
.slbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);margin-bottom:2px}
.sval{font-weight:600;font-size:.9rem;margin-bottom:12px;line-height:1.5}
.hint{background:var(--am);border:2px dashed var(--amber);border-radius:11px;padding:9px 13px;font-size:.83rem;font-weight:700;color:#3F4750}
/* ── Reading ── */
.rtxt{background:#FBFAF7;border-left:4px solid var(--teal2);padding:15px;border-radius:0 12px 12px 0;font-size:.87rem;line-height:1.8;margin-bottom:14px;color:#333}
/* ── Stars ── */
.stars{font-size:1.5rem;letter-spacing:2px;color:var(--teal)}
/* ── Indice box ── */
.ibx{background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:20px;padding:26px;text-align:center}
.iwd{font-family:'Poppins',sans-serif;font-size:2.5rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.15)}
/* ── Banners ── */
.ok{background:#EDF7EE;border:2px solid var(--green);border-radius:12px;padding:11px;font-weight:700;color:#1B5E20;font-size:.88rem}
.ko{background:#F4F1EA;border:2px solid var(--amber);border-radius:12px;padding:11px;font-weight:700;color:#3F4750;font-size:.88rem}
.err{background:#FFEBEE;border:2px solid var(--red);border-radius:12px;padding:11px;font-weight:700;color:#7F0000;font-size:.88rem}
/* ── Achievement overlay ── */
.achv{background:linear-gradient(135deg,var(--teal),#966F0B);border-radius:16px;padding:16px 20px;text-align:center;margin-bottom:12px}
/* ── Animations ── */
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fadein{animation:fadein .32s ease-out}
.chip{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:3px 11px;border-radius:50px;font-weight:700;font-size:.78rem;display:inline-block;margin:2px}
@media(max-width:580px){.mg{grid-template-columns:1fr}.card{padding:17px}.iwd{font-size:1.7rem}.lg{font-size:.93rem;padding:11px 22px}}
@media print{.noprint{display:none!important}}
</style>
</head>

/* Mission 2 — Stock Room Crisis: 3 reading sets (text + True/False, français) */

 {title:'The Empty Shelves',
  text:`It was 6:45 a.m. on Black Friday morning, and Sophie was already at the store, an hour before opening. She was checking the electronics aisle when she noticed that half the shelves for the advertised flat-screen televisions were completely empty. The delivery from the central warehouse, expected the day before, had not arrived.

  text:`At 7 a.m., three delivery lorries arrived at the same time in the small loading bay behind the store. The stockroom, already full from the previous week's deliveries, had no space left for the new boxes of Black Friday merchandise.

Thomas, the stockroom supervisor, quickly organised the lorries into a queue and asked two colleagues to help unload only the most urgent items first: the promotional products advertised in the store window. The rest of the boxes were left temporarily in the staff car park, covered with tarpaulins to protect them from the rain.

By 8:30, the priority items were on the shop floor, ready for opening. Thomas informed the store manager that the remaining stock would be brought in gradually throughout the morning, once space became available.`,

/* Mission 5 — Delivery Dispute: 3 reading sets (text + True/False, français) */

const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};

/* ═══════════════════════════ LOCAL STORAGE — PROGRESS PERSISTENCE ═══════════════════════════ */
const LS_PREFIX='bfchaos_';
const CHECKPOINTS=['m1i','m1d','m2i','m2d','m3i','m3d','m4i','m4d','m5i','m5d','m6i','m6d','fin','vic','m7','rep'];
function saveProgress(){
  if(!S.stu||!S.stu.fn||!S.stu.ln)return;
  const id=S.stu.fn+'-'+S.stu.ln;
  try{
    localStorage.setItem(LS_PREFIX+id,JSON.stringify({
      stu:S.stu,pts:S.pts,sh:S.sh,rv:S.rv,res:S.res,wr:S.wr,t0:S.t0,t1:S.t1,
      att:S.att,sets1:S.sets1,sets4:S.sets4,m7:S.m7,scr:S.scr,wordFor:S.wordFor,
      savedAt:Date.now()
    }));
  }catch(e){}
}
function loadProgress(id){
  try{const raw=localStorage.getItem(LS_PREFIX+id);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function listSaved(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf(LS_PREFIX)===0){
      try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.stu)out.push({id:d.stu.fn+'-'+d.stu.ln,pts:d.pts,scr:d.scr,savedAt:d.savedAt});}catch(e){}
    }
  }
  return out.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
}
function clearProgress(id){try{localStorage.removeItem(LS_PREFIX+id);}catch(e){}}
function resumeGame(id){
  const d=loadProgress(id);
  if(!d)return;
  S.stu=d.stu;S.pts=d.pts;S.sh=d.sh;S.rv=d.rv;S.res=d.res;S.wr=d.wr;S.t0=d.t0;S.t1=d.t1;
  S.att=d.att;S.sets1=d.sets1;S.sets4=d.sets4;S.m7=d.m7;S.wordFor=d.wordFor;
  go(d.scr||'m1i');
}

function stars(n){return'<span class="stars">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(3-n)+'</span></span>';}
function wc(str){return (str.trim().match(/\S+/g)||[]).length;}

/* Build a QCM set from a vocabulary pool subset (fresh distractors each time) */
function buildQCMSet(items){
  return items.map((item,idx)=>{
    const others=items.filter((_,j)=>j!==idx);
    const distractors=shuf(others).slice(0,3).map(x=>x.d);
    const opts=shuf([item.d,...distractors]);
    return{q:`What does "${item.w}" mean?`,o:opts,c:opts.indexOf(item.d)};
  });
}

function startWritten(mission,kind){
  S.att[mission]=1;

}
function goWrittenAttempt(mission,kind,attIdx,banner){
  if(kind==='qcm'){
    const qs=buildQCMSet(S.sets1[attIdx]);
    go('wex',{mission,kind,qs,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='vf'){
    const src=mission==='m2'?M2SETS:M5SETS;
    const set=src[attIdx];
    go('wex',{mission,kind,qs:set.vf,text:set.text,title:set.title,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='match'){
    const ps=S.sets4[attIdx];
    go('wex',{mission,kind,ps,sh:shuf(ps.map((_,i)=>i)),sel:null,mt:{},done:false,_banner:banner});
  }
}
function resolveWritten(mission,kind,score,total,wrongItems){
  const att=S.att[mission];
  let passed,ptsDelta;
  if(att===1){passed=score>=Math.ceil(total*0.8);ptsDelta=passed?50:-10;}
  else if(att===2){passed=score>=Math.ceil(total*0.7);ptsDelta=passed?30:-15;}
  else{passed=score>=Math.ceil(total*0.5);ptsDelta=Math.round(score/total*20);}
  S.pts=S.pts+ptsDelta;
  S.res[mission+'-t'+att]={score,total,success:passed,pts:ptsDelta};
  if(!passed)S.wr.push(...wrongItems);
  if(passed||att===3){
    goMissionDone(mission);
  }else{
    S.att[mission]=att+1;
    goWrittenAttempt(mission,kind,att);
  }
}
function goMissionDone(mission){
  if(mission==='m1')go('m1d');
  else if(mission==='m2')go('m2d');
  else if(mission==='m4')go('m4d');
  else if(mission==='m5')go('m5d');
}

/* ── QCM renderer ── */
function vQCM(){
  const{qs,cur=0,ans={},done=false}=E;
  if(!qs)return'';
  const q=qs[cur];const L='ABCD';const CC=['var(--teal)','var(--coral)','var(--amber)','#7B1FA2'];
  const dots=qs.map((_,i)=>{const c=done?(ans[i]===qs[i].c?'var(--green)':'var(--red)'):(ans[i]!=null?'var(--teal)':'#DDD');return`<div onclick="E.cur=${i};render()" style="width:9px;height:9px;border-radius:50%;background:${c};cursor:pointer;display:inline-block;margin:2px"></div>`;}).join('');
  const opts=q.o.map((opt,oi)=>{
    let bc='#E8E8E8',bg='#fff';
    if(ans[cur]===oi){bc='var(--teal)';bg='#FCF6E5';}
    if(done&&oi===q.c){bc='var(--green)';bg='#EDF7EE';}
    if(done&&ans[cur]===oi&&oi!==q.c){bc='var(--red)';bg='#FFEBEE';}
    const lbg=ans[cur]===oi?CC[oi]:'#F0F0F0',lc=ans[cur]===oi?'#fff':'#999';
    const mk=done?(oi===q.c?' ✓':(ans[cur]===oi?' ✗':'')):'';
    return`<div class="opt ${ans[cur]===oi?'sel':''} ${done&&oi===q.c?'right':''} ${done&&ans[cur]===oi&&oi!==q.c?'wrong':''}" onclick="${done?'':(`E.ans[${cur}]=${oi};render()`)}" style="border-color:${bc};background:${bg}">
      <div class="let" style="background:${lbg};color:${lc}">${L[oi]}</div>
      <span style="flex:1">${opt}</span><span style="font-weight:800;color:${done&&oi===q.c?'var(--green)':'var(--red)'}">${mk}</span>
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%;margin-top:4px"><div class="ok" style="flex:1;margin:0">${score}/${qs.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :(allA?btn('✅ Valider mes réponses','E.done=true;render()','teal'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(ans).length}/${qs.length} répondues</small>`);
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <span style="color:#AAA;font-size:.8rem;font-weight:700">Question ${cur+1} / ${qs.length}</span><div>${dots}</div>
    </div>
    <div style="background:var(--tl);border-radius:11px;padding:13px;margin-bottom:12px;font-weight:600;font-size:.9rem;line-height:1.5;color:#333">${q.q}</div>
    ${opts}
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${cur>0?btn('← Préc.',`E.cur=${cur-1};render()`,'gray','sm'):''}
        ${cur<qs.length-1?btn('Suiv. →',`E.cur=${cur+1};render()`,'teal','sm'):''}
      </div>${bot}
    </div>
  </div>`;
}
/* ── V/F renderer ── */
function vVF(){
  const{qs,text,title,ans={},done=false}=E;if(!qs)return'';
  const score=qs.filter((q,i)=>ans[i]===q.a).length;
  const rows=qs.map((q,i)=>{
    const bg=done?(ans[i]===q.a?'#EDF7EE':'#FFEBEE'):'#fff';
    const bc=done?(ans[i]===q.a?'var(--green)':'var(--red)'):'#E8E8E8';
    return`<div class="vfr" style="background:${bg};border-color:${bc}">
      <span style="width:21px;height:21px;background:var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0">${i+1}</span>
      <span style="flex:1;font-weight:600;font-size:.86rem;line-height:1.4">${q.s}</span>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button class="tvf" onclick="${done?'':(`E.ans[${i}]=true;render()`)}" style="border-color:var(--green);color:${ans[i]===true?'#fff':'var(--green)'};background:${ans[i]===true?'var(--green)':'#fff'}">VRAI</button>
        <button class="tvf" onclick="${done?'':(`E.ans[${i}]=false;render()`)}" style="border-color:var(--red);color:${ans[i]===false?'#fff':'var(--red)'};background:${ans[i]===false?'var(--red)':'#fff'}">FAUX</button>
      </div>
      ${done?`<span style="font-weight:800;color:${ans[i]===q.a?'var(--green)':'var(--red)'}">${ans[i]===q.a?'✓':'✗'}</span>`:''}
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${qs.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :btn('✅ Valider',`E.done=true;render()`,'teal','',!allA);
  return`<div class="rtxt"><strong style="color:var(--teal2);font-size:.8rem">📄 ${title}</strong><br><br>${text.replace(/\n\n/g,'<br><br>')}</div>${rows}<div style="margin-top:12px;display:flex;justify-content:flex-end">${bot}</div>`;
}
/* ── Matching renderer ── */
function vMatch(){
  const{ps,sh,sel,mt={},done=false}=E;if(!ps)return'';
  const used=Object.values(mt);
  const words=ps.map((p,i)=>{
    const isM=mt[i]!=null,ok=done&&mt[i]===i,ko=done&&isM&&mt[i]!==i;
    return`<div class="mi${sel===i?' msel':''}${isM&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${done||isM?'':(`selW(${i})`)}">
      <strong style="flex:1">${p.w}</strong>
      ${isM&&!done?'<span style="color:var(--coral);font-size:.72rem">✓</span>':''}
      ${ok?'<span style="color:var(--green)">✓</span>':''}${ko?'<span style="color:var(--red)">✗</span>':''}
    </div>`;
  }).join('');
  const defs=sh.map(orig=>{
    const isU=used.includes(orig);
    const mKey=Object.keys(mt).find(k=>mt[k]===orig);
    const ok=done&&mKey!=null&&Number(mKey)===orig;
    const ko=done&&isU&&!ok;
    return`<div class="mi${isU&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${isU?'':(`selD(${orig})`)}">${ps[orig].d}</div>`;
  }).join('');
  const allM=Object.keys(mt).length===ps.length;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${ps.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :(allM?btn('✅ Valider','E.done=true;render()','teal'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(mt).length}/${ps.length} associés</small>`);
  return`<div class="hint" style="margin-bottom:12px">⚠️ Aucun retour en arrière possible : lisez bien avant de valider chaque association !</div><p style="color:#AAA;font-size:.8rem;margin-bottom:10px;font-weight:700">① Cliquez un terme → ② Cliquez sa définition</p>
  <div class="mg"><div><div style="font-weight:800;color:var(--coral);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Termes</div>${words}</div>
  <div><div style="font-weight:800;color:var(--amber);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Définitions</div>${defs}</div></div>
  <div style="margin-top:13px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function selW(i){if(E.done||E.mt[i]!=null)return;E.sel=E.sel===i?null:i;render();}
function selD(orig){if(E.done||Object.values(E.mt||{}).includes(orig)||E.sel==null)return;if(!E.mt)E.mt={};E.mt[E.sel]=orig;E.sel=null;render();}

function wexDone(){
  const{mission,kind,qs,ps,ans={},mt={}}=E;
  if(kind==='qcm'){
    const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
    const wrong=qs.flatMap((q,i)=>ans[i]!==q.c?[{level:'M1',question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c]}]:[]);
    resolveWritten(mission,kind,score,qs.length,wrong);
  }else if(kind==='vf'){
    const score=qs.filter((q,i)=>ans[i]===q.a).length;
    const wrong=qs.flatMap((q,i)=>ans[i]!==q.a?[{level:mission==='m2'?'M2':'M5',question:q.s,given:ans[i]?'VRAI':'FAUX',correct:q.a?'VRAI':'FAUX'}]:[]);
    resolveWritten(mission,kind,score,qs.length,wrong);
  }else if(kind==='match'){
    const score=ps.filter((_,i)=>mt[i]===i).length;
    const wrong=ps.flatMap((p,i)=>mt[i]!==i?[{level:'M4',question:`Match: ${p.w}`,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d}]:[]);
    resolveWritten(mission,kind,score,ps.length,wrong);
  }
}

    <div style="margin-bottom:16px"><div style="font-weight:700;font-size:.88rem;margin-bottom:6px">👤 Identifiant : <span style="color:var(--teal)">${id}</span></div></div>
    ${btn('✍️ Mission bonus — Compte rendu final',"go('m7')",'coral','full lg')}
  </div>`;
}

/* ═══════════════════════════ MISSION BONUS — FINAL REPORT ═══════════════════════════ */
function vM7(){
  const n=wc(S.m7.text||'');
  const ok=n>=80;
  return`<div class="card fadein" style="border-top:4px solid var(--coral)">
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:2.6rem">✍️</div>
      <h2 class="pop" style="color:var(--coral);font-size:1.5rem;margin-top:6px">Mission bonus — Compte rendu final</h2>
    </div>
    <p style="color:#555;font-size:.88rem;line-height:1.7;margin-bottom:14px">Consigne : relatez les événements et incidents rencontrés pendant votre mission en magasin ce Black Friday. <strong>EN ANGLAIS — minimum 80 mots.</strong></p>
    <textarea id="m7ta" rows="10" placeholder="Write your report here in ENGLISH (80 words minimum)..." oninput="onM7Input(this.value)">${S.m7.text||''}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <span id="m7cnt" style="font-weight:700;font-size:.85rem;color:${ok?'var(--green)':'var(--coral)'}">${n} / 80 mots minimum</span>
      <span id="m7okbadge" class="ok" style="padding:5px 12px;font-size:.78rem;${ok?'':'display:none'}">✓ Longueur suffisante</span>
    </div>
    <div id="m7err" class="err" style="margin-top:10px;${ok?'display:none':''}">✍️ Il manque ${80-n} mot(s) pour atteindre le minimum requis.</div>
    <div style="text-align:center;margin-top:16px"><button id="m7validate" class="btn btn-teal lg" ${ok?'':'disabled'} onclick="${ok?"go('rep')":''}">📥 Valider et voir le rapport</button></div>
  </div>`;
}
function onM7Input(v){
  S.m7.text=v;
  const n=wc(v),ok=n>=80;
  const cnt=document.getElementById('m7cnt');
  if(cnt){cnt.textContent=`${n} / 80 mots minimum`;cnt.style.color=ok?'var(--green)':'var(--coral)';}
  const badge=document.getElementById('m7okbadge');
  if(badge)badge.style.display=ok?'inline-block':'none';
  const err=document.getElementById('m7err');
  if(err){err.style.display=ok?'none':'block';err.textContent=`✍️ Il manque ${80-n} mot(s) pour atteindre le minimum requis.`;}
  const vb=document.getElementById('m7validate');
  if(vb){if(ok){vb.removeAttribute('disabled');vb.setAttribute('onclick',"go('rep')");}else{vb.setAttribute('disabled','disabled');vb.removeAttribute('onclick');}}
}

/* ═══════════════════════════ REPORT ═══════════════════════════ */
function vReport(){
  const dur=ftm(S.t0,S.t1);
  const LN={'m1-t1':'📋 Vocab — tentative 1','m1-t2':'📋 Vocab — tentative 2','m1-t3':'📋 Vocab — tentative 3',
    'm2-t1':'🔍 Stock Room — tentative 1','m2-t2':'🔍 Stock Room — tentative 2','m2-t3':'🔍 Stock Room — tentative 3',
    'm3-t1':'😠 Oral client — tentative 1','m3-t2':'😠 Oral client — tentative 2','m3-t3':'😠 Oral client — tentative 3',
    'm4-t1':'📌 Vocab fournisseur — tentative 1','m4-t2':'📌 Vocab fournisseur — tentative 2','m4-t3':'📌 Vocab fournisseur — tentative 3',
    'm5-t1':'🚚 Delivery Dispute — tentative 1','m5-t2':'🚚 Delivery Dispute — tentative 2','m5-t3':'🚚 Delivery Dispute — tentative 3',
    'm6-t1':'📊 Debrief oral — tentative 1','m6-t2':'📊 Debrief oral — tentative 2','m6-t3':'📊 Debrief oral — tentative 3'};
  const id=`${S.stu.fn}-${S.stu.ln}`;
  const rows=Object.entries(S.res).map(([k,v])=>{
    const scoreTxt=v.score!=null?`${v.score}/${v.total}`:(v.grade!=null?`${v.grade}/10`:'—');
    return`<tr><td style="padding:9px;font-weight:700;font-size:.84rem">${LN[k]||k}</td><td style="padding:9px"><span style="background:${v.success?'var(--green)':'var(--red)'};color:#fff;padding:2px 9px;border-radius:50px;font-size:.73rem;font-weight:800">${v.success?'✓ Réussi':'✗ Non réussi'}</span></td><td style="padding:9px;color:#888;font-size:.84rem">${scoreTxt}</td><td style="padding:9px;color:${v.pts>=0?'var(--green)':'var(--red)'};font-size:.84rem;font-weight:700">${v.pts>=0?'+':''}${v.pts} pts</td></tr>`;
  }).join('');
  const errs=S.wr.length===0
    ?`<div class="ok" style="text-align:center;margin-top:6px">🏆 Aucune erreur enregistrée !</div>`
    :S.wr.map(w=>`<div style="background:#fff;border:1px solid #F2D9CD;border-radius:9px;padding:11px;margin-bottom:8px"><div style="font-weight:700;font-size:.84rem;color:#333">${w.question}</div><div style="color:var(--red);font-size:.8rem;margin-top:3px">✗ Réponse donnée : ${w.given||'—'}</div><div style="color:var(--green);font-size:.8rem">✓ Réponse correcte : ${w.correct}</div></div>`).join('');
  const m7block=(S.m7.text&&wc(S.m7.text)>0)
    ?`<div class="card"><div class="pop" style="color:var(--coral);margin-bottom:10px">✍️ Mission bonus — Compte rendu final (${wc(S.m7.text)} mots)</div><p style="white-space:pre-wrap;font-size:.87rem;line-height:1.7;color:#333">${(S.m7.text||'').replace(/</g,'&lt;')}</p></div>`
    :'';
  return`<div id="rep" style="max-width:780px;margin:0 auto;padding:20px;padding-bottom:40px">
  <div class="noprint" style="margin-bottom:14px;display:flex;gap:9px;flex-wrap:wrap">
    ${btn('← Retour',"go(S._returnTo||'vic',S._returnE||{})",'gray','sm')}
    ${btn('🖨️ Enregistrer PDF','window.print()','teal','sm')}
  </div>
  <div class="glass" style="background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:18px;padding:28px;text-align:center;color:#fff;margin-bottom:16px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
    <div class="pop" style="font-size:1.6rem;margin-bottom:4px">🛍️ Black Friday Chaos</div>
    <div style="opacity:.85;font-size:.88rem">English Escape Game — Bac Pro 1ère Commerce</div>
    <div style="opacity:.7;font-size:.78rem;margin-top:4px">${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div class="card" style="text-align:center;border-top:3px solid var(--teal)"><div style="font-weight:800;font-size:1rem;color:var(--teal)">${id}</div><div style="color:#888;font-size:.78rem;margin-top:3px">Identifiant</div></div>
    <div class="card" style="text-align:center;border-top:3px solid var(--coral)"><div class="pop" style="font-size:1.9rem;color:var(--teal)">${S.pts}</div><div style="color:#888;font-size:.78rem">Points • ${dur}</div><div style="margin-top:6px">${stars(starRating(S.pts,420).s)}</div></div>
  </div>
  <div class="card"><div class="pop" style="color:var(--teal);margin-bottom:12px">🎯 Résultats par mission</div>
    <table style="width:100%;border-collapse:collapse"><tr style="background:var(--tl)"><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Mission</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Résultat</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Score</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Points</th></tr>${rows}</table>
  </div>
  ${m7block}
  <div class="card"><div class="pop" style="color:var(--red);margin-bottom:12px">❌ Erreurs commises</div>${errs}</div>
  <div style="background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:14px;padding:14px 22px;text-align:center;font-family:'Poppins';font-weight:900;font-size:1.15rem;color:#fff;margin-bottom:14px">✅ THIS STORE SURVIVED BLACK FRIDAY CHAOS</div>
  <div style="text-align:center;color:#BBB;font-size:.76rem">Créé par C. Iemfre • Black Friday Chaos — English Escape Game Bac Pro Commerce</div>
  </div>`;
}

/* ═══════════════════════════ RGPD (texte exact) ═══════════════════════════ */
function vRGPD(){
  return`<div style="min-height:100vh;padding:20px 18px 40px">
  <div style="max-width:580px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:8px">
      <span style="color:#AAA;cursor:pointer;font-size:.83rem;font-weight:700" onclick="go('home')">← Retour</span>
    </div>
    <div class="glass" style="background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:16px;padding:26px;text-align:center;color:#fff;margin-bottom:18px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
      <div style="font-size:2.4rem;margin-bottom:8px">🔒</div>
      <h1 class="pop" style="font-size:1.5rem;margin-bottom:4px">Protection des données personnelles</h1>
      <p style="opacity:.75;font-size:.82rem">Black Friday Chaos — English Escape Game</p>
    </div>
    <div class="card" style="border-left:4px solid var(--teal);margin-bottom:10px">
      <p style="color:#333;font-size:.9rem;line-height:1.82">Cette application est un outil pédagogique développé pour un usage en classe.</p>
    </div>
    <div style="display:grid;gap:9px;margin-bottom:18px">
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Aucune donnée n'est transmise à un serveur externe : toutes les informations (identifiant, réponses, score) restent uniquement dans la mémoire de votre navigateur, le temps de la partie en cours.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Les seules données saisies sont : les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Ces données sauvegardées en stockage local uniquement (sur la tablette utilisée par l'élève uniquement).</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur.</p>
      </div>
    </div>
  </div></div>`;
}

/* ═══════════════════════════ ROUTER ═══════════════════════════ */
function go(scr,ei={}){E=ei;S.scr=scr;if(CHECKPOINTS.includes(scr))saveProgress();render();window.scrollTo(0,0);}
function render(){document.getElementById('app').innerHTML=view()+profFab()+scoreBadge()+reportFab();}
function view(){
  const sc=S.scr;
  if(sc==='home')return vHome();
  if(sc==='rules')return vRules();
  if(sc==='rgpd')return vRGPD();
  if(sc==='tlg')return vLogin('Interface Professeur','tdb');
  if(sc==='tdb')return vTeacher();
  if(sc==='slg')return vLogin('Connexion Élève','id');
  if(sc==='id')return vId();

  const W=hdr;
  /* Mission 1 — Store Floor (QCM) */
  if(sc==='m1i')return W(1)+`<div class="page">${lvlIntro('📋','Mission 1 — Store Floor','Vocabulaire de la vente','<p style="font-weight:700;margin-bottom:7px">Welcome to Black Friday!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Avant d\'accueillir les premiers clients, prouvez que vous maîtrisez le vocabulaire essentiel de la vente en boutique. 10 questions. Seuil de réussite : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m1','qcm')",'teal')}</div>`;
  if(sc==='wex'&&E.mission==='m1')return W(1)+`<div class="page">${E._banner||''}<div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--teal);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m1}</span><strong style="font-size:.95rem">QCM — Vocabulaire de la vente</strong></div>${vQCM()}</div></div>`;
  if(sc==='m1d')return W(1)+`<div class="page">${indiceScreen('m1',"go('m2i')")}</div>`;

  /* Mission 2 — Stock Room Crisis (VF) */
  if(sc==='m2i')return W(2)+`<div class="page">${lvlIntro('🔍','Mission 2 — Stock Room Crisis','Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">A stockroom problem has just come up!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez le texte professionnel puis répondez aux 8 affirmations Vrai/Faux. Seuil : ≥ 80% à la 1ère tentative, ≥ 70% à la 2e. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m2','vf')",'coral')}</div>`;
  if(sc==='wex'&&E.mission==='m2')return W(2)+`<div class="page">${E._banner||''}<div class="card card-coral"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--coral);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m2}</span><strong style="font-size:.95rem">Vrai / Faux</strong></div>${vVF()}</div></div>`;
  if(sc==='m2d')return W(2)+`<div class="page">${indiceScreen('m2',"go('m3i')")}</div>`;

  /* Mission 3 — Customer Complaint (Oral solo) */
  if(sc==='m3i')return W(3)+`<div class="page">${lvlIntro('😠','Mission 3 — Customer Complaint','Expression orale','<p style="font-weight:700;margin-bottom:7px">A live situation at the customer service desk!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Vous lisez la carte de situation et gérez seul(e) l\'interaction en anglais. <strong>Mots-clés seulement, 8 maximum, aucune phrase apprise.</strong></p>',"startOral('m3')",'teal')}</div>`;
  if(sc==='oex'&&E.mission==='m3')return W(3)+`<div class="page">${vOral()}</div>`;
  if(sc==='m3d')return W(3)+`<div class="page">${indiceScreen('m3',"go('m4i')")}</div>`;

  /* Mission 4 — Supplier Call (Matching) */
  if(sc==='m4i')return W(4)+`<div class="page">${lvlIntro('📌','Mission 4 — Supplier Call','Correspondance commerciale','<p style="font-weight:700;margin-bottom:7px">The supplier files are scrambled!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque terme de la relation fournisseur/logistique à sa définition exacte. Seuil : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Lisez bien tous les mots et toutes les définitions AVANT de commencer : une fois qu\'une association est validée, il est impossible de revenir en arrière ou de la corriger !</p>',"startWritten('m4','match')",'teal')}</div>`;
  if(sc==='wex'&&E.mission==='m4')return W(4)+`<div class="page">${E._banner||''}<div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:#7B1FA2;color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m4}</span><strong style="font-size:.95rem">Correspondance — Vocabulaire fournisseur</strong></div>${vMatch()}</div></div>`;
  if(sc==='m4d')return W(4)+`<div class="page">${indiceScreen('m4',"go('m5i')")}</div>`;

  /* Mission 5 — Delivery Dispute (VF) */
  if(sc==='m5i')return W(5)+`<div class="page">${lvlIntro('🚚','Mission 5 — Delivery Dispute','Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">A delivery complaint has just arrived!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez le texte professionnel puis répondez aux 8 affirmations Vrai/Faux. Seuil : ≥ 80% à la 1ère tentative, ≥ 70% à la 2e. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m5','vf')",'coral')}</div>`;
  if(sc==='wex'&&E.mission==='m5')return W(5)+`<div class="page">${E._banner||''}<div class="card card-coral"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--coral);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m5}</span><strong style="font-size:.95rem">Vrai / Faux</strong></div>${vVF()}</div></div>`;
  if(sc==='m5d')return W(5)+`<div class="page">${indiceScreen('m5',"go('m6i')")}</div>`;

  /* Mission 6 — Manager's Debrief (Oral solo report) */
  if(sc==='m6i')return W(6)+`<div class="page">${lvlIntro('📊',"Mission 6 — Manager's Debrief",'Compte rendu oral','<p style="font-weight:700;margin-bottom:7px">Final mission — the manager needs your report!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez la fiche d\'incident et présentez seul(e) un compte rendu structuré en anglais. <strong>Mots-clés seulement.</strong></p>',"startOral('m6')",'coral')}</div>`;
  if(sc==='oex'&&E.mission==='m6')return W(6)+`<div class="page">${vOral()}</div>`;
  if(sc==='m6d')return W(6)+`<div class="page">${indiceScreen('m6',"go('fin')")}</div>`;

  if(sc==='fin')return W(6)+`<div class="page">${vFinal()}</div>`;
  if(sc==='vic')return W(6)+`<div class="page">${vVictory()}</div>`;
  if(sc==='m7')return W(6)+`<div class="page">${vM7()}</div>`;
  if(sc==='rep')return vReport();
  return'<p>Écran inconnu</p>';
}
render();
</script></body></html>
